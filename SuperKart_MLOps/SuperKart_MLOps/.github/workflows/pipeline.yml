jobs:

  mlops-pipeline:

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # 1. CHECKOUT CODE
      # ======================================================

      - name: Checkout Code
        uses: actions/checkout@v4


      # ======================================================
      # 2. SET UP PYTHON
      # ======================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"


      # ======================================================
      # 3. INSTALL DEPENDENCIES
      # ======================================================

      - name: Install Dependencies
        working-directory: SuperKart_MLOps
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt


      # ======================================================
      # 4. VERIFY PROJECT STRUCTURE
      # ======================================================

      - name: Verify Project Structure
        run: |

          echo "=========================================="
          echo "SUPERKART MLOPS PROJECT STRUCTURE"
          echo "=========================================="

          test -d SuperKart_MLOps
          test -d SuperKart_MLOps/model_building
          test -d SuperKart_MLOps/deployment
          test -d SuperKart_MLOps/app

          echo ""
          echo "Project directory:"
          ls -la SuperKart_MLOps

          echo ""
          echo "Model building files:"
          ls -la SuperKart_MLOps/model_building

          echo ""
          echo "Deployment files:"
          ls -la SuperKart_MLOps/deployment

          echo ""
          echo "Application files:"
          ls -la SuperKart_MLOps/app

          echo ""
          echo "Project structure verified."


      # ======================================================
      # 5. VERIFY HUGGING FACE TOKEN
      # ======================================================

      - name: Verify Hugging Face Authentication
        working-directory: SuperKart_MLOps
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |

          echo "=========================================="
          echo "VERIFY HUGGING FACE AUTHENTICATION"
          echo "=========================================="

          if [ -z "$HF_TOKEN" ]; then
            echo "ERROR: HF_TOKEN GitHub secret is missing."
            exit 1
          fi

          python - <<'PY'

          import os
          from huggingface_hub import whoami

          token = os.environ.get("HF_TOKEN")

          if not token:
              raise ValueError(
                  "HF_TOKEN environment variable is missing."
              )

          user = whoami(token=token)

          print(
              "Authenticated Hugging Face user:",
              user["name"]
          )

          print("Hugging Face authentication verified.")

          PY


      # ======================================================
